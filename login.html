<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入 - 非典型就業青年多領域接案</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <div class="logo">非典型就業青年多領域接案</div>
                <ul class="nav-menu">
                    <li><a href="index.html">首頁</a></li>
                    <li><a href="services.html">服務項目</a></li>
                    <li><a href="about.html">關於我</a></li>
                    <li><a href="login.html" id="loginLink">會員服務</a></li>
                    <li><a href="terms.html">使用條款</a></li>
                </ul>
                <div class="logout-btn" id="logoutBtn" style="display: none;">
                    <button onclick="logout()">登出</button>
                </div>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>會員服務</h1>
                <p>登入後即可使用點數購買服務</p>
            </div>
        </section>

        <section class="login-section">
            <div class="container">
                <div id="loginFormContainer">
                    <div class="form-container">
                        <h2>會員登入</h2>
                        <form id="loginForm">
                            <div class="form-group">
                                <label for="username">帳號</label>
                                <input type="text" id="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">密碼</label>
                                <input type="password" id="password" required>
                            </div>
                            <button type="submit" class="btn-primary">登入</button>
                        </form>
                        
                        <div class="register-section-login">
                            <h3>會員註冊及購買點數</h3>
                            <p>請透過以下方式聯繫我們進行註冊：</p>
                            <a href="register.html" class="btn-secondary">前往註冊</a>
                        </div>
                    </div>
                </div>
                
                <div id="balanceSection" class="balance-section" style="display: none;">
                    <h2>點數餘額</h2>
                    <div class="balance-display">
                        <p id="balanceAmount">點數餘額: 0 點</p>
                    </div>
                    <a href="register.html" class="btn-secondary">會員註冊及購買點數</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 非典型就業青年多領域接案. 保留一切權利.</p>
        </div>
    </footer>

    <script>
        document.querySelector('.hamburger').addEventListener('click', function() {
            document.querySelector('.nav-menu').classList.toggle('active');
        });
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // In a real implementation, this would verify credentials
            // For demo, we'll just show a success message
            alert('登入成功！');
            
            // Store login state
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', username);
            
            // Update UI
            document.getElementById('loginFormContainer').style.display = 'none';
            document.getElementById('balanceSection').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('loginLink').textContent = '會員服務';
            
            // Update balance (demo)
            document.getElementById('balanceAmount').textContent = '點數餘額: 1,000 點';
        });
        
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('currentUser');
            
            // Update UI
            document.getElementById('loginFormContainer').style.display = 'block';
            document.getElementById('balanceSection').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('loginLink').textContent = '會員登入';
            
            // Clear form
            document.getElementById('loginForm').reset();
        }
        
        // Check login state on page load
        window.addEventListener('load', function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                document.getElementById('loginFormContainer').style.display = 'none';
                document.getElementById('balanceSection').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('loginLink').textContent = '會員服務';
                
                // Update balance (demo)
                document.getElementById('balanceAmount').textContent = '點數餘額: 1,000 點';
            }
        });
    </script>
</body>
